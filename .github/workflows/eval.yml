name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m pytest -v tests/test_fusion.py tests/test_golden_dataset.py
